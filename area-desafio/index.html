  <style>
    :root {
      --cream:       #FAF7F2;
      --gold:        #C5965A;
      --gold-light:  #E8D4B5;
      --gold-dark:   #A07840;
      --brown:       #2C1A0E;
      --brown-mid:   #5A3E28;
      --brown-light: #8B6A4A;
      --white:       #FFFFFF;
      --off-white:   #F4EFE6;
      --green:       #3D8B5E;
      --green-light: #E8F5EE;
      --blue:        #2D6A9F;
      --blue-light:  #E8F0FA;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior:smooth; font-size:16px; }
    body { font-family:'Poppins', sans-serif; background:var(--cream); color:var(--brown); min-height:100vh; }

    .page-loading {
      position:fixed; inset:0; background:var(--brown);
      display:flex; align-items:center; justify-content:center;
      flex-direction:column; gap:14px; z-index:9999; transition:opacity .4s;
    }
    .page-loading.hide { opacity:0; pointer-events:none; }
    .loading-logo { color:var(--gold-light); font-size:1.1rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
    .loading-spinner {
      width:36px; height:36px; border:3px solid rgba(197,150,90,.3);
      border-top-color:var(--gold); border-radius:50%; animation:spin .8s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    .app-header {
      background:var(--brown); padding:0 24px;
      display:flex; align-items:center; justify-content:space-between;
      height:64px; position:sticky; top:0; z-index:100;
      box-shadow:0 2px 20px rgba(0,0,0,.3);
    }
    .header-brand { color:var(--gold-light); text-decoration:none; }
    .header-brand-name { font-size:.95rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
    .header-brand-sub  { font-size:.6rem; letter-spacing:.15em; text-transform:uppercase; color:rgba(229,212,181,.4); }
    .header-user { display:flex; align-items:center; gap:12px; }
    .header-progress-badge {
      background:rgba(197,150,90,.2); border:1px solid rgba(197,150,90,.4);
      border-radius:100px; padding:4px 14px; font-size:.78rem; font-weight:600; color:var(--gold-light);
    }
    .header-user-name { font-size:.82rem; color:rgba(229,212,181,.7); max-width:120px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    @media(max-width:480px){ .header-user-name { display:none; } }

    .app-body { max-width:820px; margin:0 auto; padding:28px 20px 60px; }

    .welcome-banner {
      background:linear-gradient(135deg, var(--brown) 0%, #3D2410 100%);
      border-radius:18px; padding:28px; margin-bottom:28px;
      display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    }
    .welcome-text h2 { font-size:1.4rem; font-weight:700; color:var(--white); margin-bottom:4px; }
    .welcome-text h2 span { font-family:'Dancing Script', cursive; color:var(--gold); }
    .welcome-text p { font-size:.85rem; color:rgba(229,212,181,.7); }
    .welcome-progress {
      text-align:center; background:rgba(197,150,90,.15); border:1px solid rgba(197,150,90,.3);
      border-radius:14px; padding:14px 24px; flex-shrink:0;
    }
    .welcome-progress-number { font-size:2.2rem; font-weight:700; color:var(--gold); line-height:1; }
    .welcome-progress-label  { font-size:.72rem; color:rgba(229,212,181,.6); text-transform:uppercase; letter-spacing:.06em; }

    .section-card { background:var(--white); border-radius:16px; padding:24px; margin-bottom:20px; box-shadow:0 2px 16px rgba(44,26,14,.08); }
    .section-card-title { font-size:1rem; font-weight:700; color:var(--brown); margin-bottom:16px; display:flex; align-items:center; gap:8px; }
    .section-card-title .badge { background:var(--gold); color:var(--brown); font-size:.65rem; font-weight:700; padding:2px 8px; border-radius:100px; text-transform:uppercase; letter-spacing:.06em; }

    /* Progress dots */
    .progress-dots { display:flex; gap:8px; flex-wrap:wrap; }
    .progress-dot {
      width:36px; height:36px; border-radius:50%; border:2px solid var(--gold-light);
      display:flex; align-items:center; justify-content:center;
      font-size:.75rem; font-weight:700; color:var(--brown-light);
      transition:all .3s;
    }
    .progress-dot.done { background:var(--gold); border-color:var(--gold); color:var(--brown); }
    .progress-dot.done::after { content:'✓'; }
    .progress-dot.done span { display:none; }

    .days-list { display:flex; flex-direction:column; gap:10px; }
    .day-item { border:1px solid #EDE3D5; border-radius:14px; overflow:hidden; }
    .day-header { display:flex; align-items:center; gap:14px; padding:16px 20px; cursor:pointer; background:var(--white); transition:background .15s; user-select:none; }
    .day-header:hover { background:var(--cream); }
    .day-header.open { background:var(--cream); border-bottom:1px solid #EDE3D5; }
    .day-num { width:36px; height:36px; border-radius:50%; background:var(--gold); color:var(--brown); font-size:.85rem; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .day-num.done { background:var(--green); color:var(--white); }
    .day-info { flex:1; }
    .day-title { font-size:.92rem; font-weight:600; color:var(--brown); }
    .day-subtitle { font-size:.76rem; color:var(--brown-light); margin-top:2px; }
    .day-chevron { font-size:1rem; color:var(--brown-light); transition:transform .2s; }
    .day-header.open .day-chevron { transform:rotate(180deg); }
    .day-body { display:none; padding:20px; background:var(--white); }
    .day-body.open { display:block; }

    .video-wrap { position:relative; width:100%; padding-top:56.25%; border-radius:12px; overflow:hidden; background:#000; margin-bottom:20px; }
    .video-wrap iframe { position:absolute; inset:0; width:100%; height:100%; border:none; }
    .video-coming { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:var(--brown); color:rgba(229,212,181,.5); font-size:.9rem; gap:8px; }
    .video-coming span { font-size:2rem; }

    .btn-pdf {
      display:flex; align-items:center; gap:10px; padding:12px 18px;
      background:var(--blue-light); border:1.5px solid rgba(45,106,159,.25);
      border-radius:12px; text-decoration:none; color:var(--blue);
      font-size:.85rem; font-weight:600; margin-bottom:20px; transition:all .2s;
    }
    .btn-pdf:hover { background:#d8e8f8; border-color:var(--blue); }
    .pdf-coming {
      padding:12px 18px; background:var(--off-white); border:1.5px dashed var(--gold-light);
      border-radius:12px; font-size:.82rem; color:var(--brown-light); margin-bottom:20px; text-align:center;
    }

    .day-section-label { font-size:.78rem; font-weight:700; color:var(--brown-light); text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px; padding-bottom:6px; border-bottom:1px solid var(--gold-light); }

    .upload-area { border:2px dashed var(--gold-light); border-radius:12px; padding:20px; text-align:center; cursor:pointer; transition:all .2s; background:var(--cream); margin-bottom:14px; }
    .upload-area:hover { border-color:var(--gold); background:var(--off-white); }
    .upload-area-icon { font-size:2rem; margin-bottom:6px; }
    .upload-area-text { font-size:.83rem; color:var(--brown-light); line-height:1.5; }
    .upload-input { display:none; }

    .photo-preview { display:none; position:relative; margin-bottom:14px; }
    .photo-preview img { width:100%; border-radius:12px; max-height:280px; object-fit:cover; }
    .photo-preview-remove { position:absolute; top:8px; right:8px; background:rgba(0,0,0,.6); color:white; border:none; border-radius:50%; width:28px; height:28px; cursor:pointer; font-size:1rem; line-height:1; }

    .btn-upload { width:100%; height:44px; border-radius:12px; background:var(--gold); border:none; cursor:pointer; font-family:'Poppins', sans-serif; font-size:.88rem; font-weight:700; color:var(--brown); transition:all .2s; display:none; }
    .btn-upload.visible { display:block; }
    .btn-upload:hover { background:var(--gold-dark); }
    .btn-upload:disabled { opacity:.6; pointer-events:none; }

    .upload-success { display:none; background:var(--green-light); border:1px solid rgba(61,139,94,.3); border-radius:10px; padding:12px 16px; font-size:.82rem; color:var(--green); text-align:center; margin-top:8px; }
    .upload-success.show { display:block; }

    .sent-photos { margin-top:16px; }
    .sent-photos-title { font-size:.78rem; font-weight:600; color:var(--brown-light); text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px; }
    .sent-photos-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(100px, 1fr)); gap:8px; }
    .sent-photo-item { position:relative; border-radius:10px; overflow:hidden; aspect-ratio:1; }
    .sent-photo-item img { width:100%; height:100%; object-fit:cover; }

    .bruna-comment { background:var(--off-white); border-left:3px solid var(--gold); border-radius:0 10px 10px 0; padding:12px 16px; margin-top:12px; }
    .bruna-comment-who { font-size:.72rem; font-weight:700; color:var(--gold-dark); text-transform:uppercase; letter-spacing:.06em; margin-bottom:4px; }
    .bruna-comment-text { font-size:.85rem; color:var(--brown-mid); line-height:1.5; }

    .checkin-row { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
    .btn-checkin { flex:1; min-width:140px; height:44px; border-radius:12px; border:1.5px solid var(--gold-light); background:var(--cream); font-family:'Poppins', sans-serif; font-size:.83rem; font-weight:600; color:var(--brown-mid); cursor:pointer; transition:all .2s; }
    .btn-checkin:hover { background:var(--off-white); border-color:var(--gold); }
    .btn-checkin.done { background:var(--green-light); border-color:rgba(61,139,94,.4); color:var(--green); }
    .btn-checkin:disabled { opacity:.6; pointer-events:none; }

    .before-after-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    @media(max-width:480px){ .before-after-grid { grid-template-columns:1fr; } }
    .ba-label { font-size:.78rem; font-weight:600; color:var(--brown-light); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; }

    .admin-panel { display:none; background:var(--white); border:2px solid var(--gold); border-radius:16px; padding:24px; margin-bottom:20px; box-shadow:0 2px 16px rgba(44,26,14,.08); }
    .admin-panel.visible { display:block; }
    .admin-panel-title { font-size:1rem; font-weight:700; color:var(--brown); margin-bottom:20px; display:flex; align-items:center; gap:8px; }
    .admin-tag { background:var(--gold); color:var(--brown); font-size:.65rem; font-weight:700; padding:3px 10px; border-radius:100px; text-transform:uppercase; }

    .participants-list { display:flex; flex-direction:column; gap:10px; }
    .participant-row { border:1px solid #EDE3D5; border-radius:12px; overflow:hidden; }
    .participant-header { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; cursor:pointer; background:var(--cream); transition:background .15s; }
    .participant-header:hover { background:var(--off-white); }
    .participant-name { font-size:.9rem; font-weight:600; color:var(--brown); }
    .participant-meta { font-size:.75rem; color:var(--brown-light); margin-top:2px; }
    .participant-prog-badge { background:var(--gold-light); color:var(--brown-mid); font-size:.75rem; font-weight:700; padding:3px 10px; border-radius:100px; }
    .participant-body { display:none; padding:16px; background:var(--white); }
    .participant-body.open { display:block; }
    .participant-photos-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(90px, 1fr)); gap:8px; margin-bottom:14px; }
    .participant-photo-item { position:relative; border-radius:8px; overflow:hidden; aspect-ratio:1; }
    .participant-photo-item img { width:100%; height:100%; object-fit:cover; }
    .participant-photo-tipo { position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,.6); color:var(--gold-light); font-size:.6rem; text-align:center; padding:2px; }
    .admin-comment-form { margin-top:14px; }
    .admin-comment-form textarea { width:100%; border:1.5px solid var(--gold-light); border-radius:10px; padding:12px; resize:vertical; min-height:72px; font-family:'Poppins', sans-serif; font-size:.85rem; color:var(--brown); background:var(--cream); outline:none; }
    .admin-comment-form textarea:focus { border-color:var(--gold); }
    .btn-comment { margin-top:8px; height:40px; padding:0 20px; border-radius:10px; background:var(--gold); border:none; cursor:pointer; font-family:'Poppins', sans-serif; font-size:.82rem; font-weight:700; color:var(--brown); transition:all .2s; }
    .btn-comment:hover { background:var(--gold-dark); }
    .btn-comment:disabled { opacity:.6; pointer-events:none; }
    .no-participants { font-size:.85rem; color:var(--brown-light); text-align:center; padding:20px; }

    .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--brown); color:var(--gold-light); padding:12px 24px; border-radius:12px; font-size:.85rem; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,.3); z-index:9999; opacity:0; transition:opacity .3s; pointer-events:none; white-space:nowrap; }
    .toast.show { opacity:1; }
  </style>
</head>
<body>

<div class="page-loading" id="pageLoading">
  <div class="loading-logo">Comece Leve</div>
  <div class="loading-spinner"></div>
</div>

<div class="toast" id="toast"></div>

<header class="app-header">
  <a class="header-brand" href="/">
    <div class="header-brand-name">Bruna Boreggio</div>
    <div class="header-brand-sub">Desafio Comece Leve</div>
  </a>
  <div class="header-user">
    <div class="header-progress-badge" id="headerProgress">0/10 dias</div>
    <div class="header-user-name" id="headerName">—</div>
  </div>
</header>

<div class="app-body">

  <div class="welcome-banner">
    <div class="welcome-text">
      <h2>Olá, <span id="welcomeName">participante</span>! 🌿</h2>
      <p>Seu desafio de 10 dias começa aqui. Assista ao vídeo de cada dia e registre sua evolução.</p>
    </div>
    <div class="welcome-progress">
      <div class="welcome-progress-number" id="totalDays">0</div>
      <div class="welcome-progress-label">de 10 dias</div>
    </div>
  </div>

  <div class="section-card">
    <div class="section-card-title">📅 Seu Progresso</div>
    <div class="progress-dots" id="progressDots"></div>
  </div>

  <div class="admin-panel" id="adminPanel">
    <div class="admin-panel-title">Painel da Bruna <span class="admin-tag">Admin</span></div>
    <div class="participants-list" id="participantsList">
      <div class="no-participants">Carregando participantes…</div>
    </div>
  </div>

  <div class="section-card">
    <div class="section-card-title">📅 Os 10 Dias do Desafio</div>
    <div class="days-list" id="daysList"></div>
  </div>

</div>

<script>
var WEBHOOK = 'https://script.google.com/macros/s/AKfycbwEQ0IPi3asolr6swrG_5sZy_eHc87WxWXwGI4w75Aw3kocrC4xaEu6tNQMiuwdGtfvgw/exec';

var DAYS = [
  { num:1,  title:'Começando do zero',          sub:'Por que a maioria falha nas dietas',  videoId:'',            pdfUrl:'', hasBefore:true },
  { num:2,  title:'O prato ideal',              sub:'Como montar refeições equilibradas',   videoId:'',            pdfUrl:'' },
  { num:3,  title:'Hidratação que transforma',  sub:'A meta de água que vai mudar tudo',    videoId:'',            pdfUrl:'' },
  { num:4,  title:'Alimentos inflamatórios',    sub:'O que evitar e por quê',               videoId:'tKL7rhR5OhY', pdfUrl:'' },
  { num:5,  title:'Meio caminho!',              sub:'Revisando e ajustando a rota',         videoId:'ugQTxZL6TlQ', pdfUrl:'' },
  { num:6,  title:'Rotina que sustenta',        sub:'Criando hábitos reais e duradouros',   videoId:'',            pdfUrl:'' },
  { num:7,  title:'Exercício e alimentação',    sub:'A combinação que acelera resultados',  videoId:'',            pdfUrl:'' },
  { num:8,  title:'Emoções e comida',           sub:'Entendendo a fome emocional',          videoId:'',            pdfUrl:'' },
  { num:9,  title:'Planejamento semanal',       sub:'Como se organizar para não errar',     videoId:'',            pdfUrl:'' },
  { num:10, title:'Você chegou lá!',            sub:'Próximos passos e manutenção',         videoId:'',            pdfUrl:'', hasAfter:true }
];

var currentUser = {}, isAdmin = false, completedDays = {};

window.addEventListener('DOMContentLoaded', function() {
  var saved = JSON.parse(localStorage.getItem('desafio_user') || '{}');
  if (!saved.email) { window.location.replace('/area-premium/'); return; }
  currentUser = saved;
  renderArea();
  fetch(WEBHOOK + '?action=verify_payment&email=' + encodeURIComponent(saved.email))
    .then(function(r){ return r.json(); })
    .then(function(data) {
      if (!data.pago) { window.location.replace('/area-premium/'); return; }
      if (data.isAdmin) {
        isAdmin = true;
        document.getElementById('adminPanel').classList.add('visible');
        loadParticipants();
      }
    })
    .catch(function() {});
});

function renderArea() {
  var firstName = currentUser.nome ? currentUser.nome.split(' ')[0] : 'participante';
  document.getElementById('welcomeName').textContent = firstName;
  document.getElementById('headerName').textContent  = firstName;
  buildProgressDots();
  buildDays();
  loadMyData();
  hidePage();
}

function hidePage() {
  var loader = document.getElementById('pageLoading');
  loader.classList.add('hide');
  setTimeout(function(){ loader.style.display='none'; }, 500);
}

function buildProgressDots() {
  var container = document.getElementById('progressDots');
  DAYS.forEach(function(day) {
    var dot = document.createElement('div');
    dot.className = 'progress-dot';
    dot.id = 'dot-' + day.num;
    dot.innerHTML = '<span>' + day.num + '</span>';
    container.appendChild(dot);
  });
}

function updateProgress() {
  var count = 0;
  DAYS.forEach(function(day) {
    var dot = document.getElementById('dot-' + day.num);
    var numEl = document.getElementById('dn-' + day.num);
    if (completedDays[day.num]) {
      count++;
      if (dot) dot.classList.add('done');
      if (numEl) numEl.classList.add('done');
    }
  });
  document.getElementById('totalDays').textContent = count;
  document.getElementById('headerProgress').textContent = count + '/10 dias';
}

function buildDays() {
  var list = document.getElementById('daysList');
  DAYS.forEach(function(day) {
    var item = document.createElement('div');
    item.className = 'day-item';
    item.innerHTML =
      '<div class="day-header" id="dh-'+day.num+'" onclick="toggleDay('+day.num+')">' +
        '<div class="day-num" id="dn-'+day.num+'">'+day.num+'</div>' +
        '<div class="day-info"><div class="day-title">'+day.title+'</div><div class="day-subtitle">'+day.sub+'</div></div>' +
        '<div class="day-chevron">▼</div>' +
      '</div>' +
      '<div class="day-body" id="db-'+day.num+'">' + buildDayBody(day) + '</div>';
    list.appendChild(item);
  });
}

function buildDayBody(day) {
  /* 1. Vídeo (topo) */
  var videoHtml = day.videoId
    ? '<div class="video-wrap"><iframe src="https://www.youtube.com/embed/'+day.videoId+'" allowfullscreen></iframe></div>'
    : '<div class="video-wrap"><div class="video-coming"><span>🎥</span>Vídeo em breve</div></div>';

  /* 2. PDF */
  var pdfHtml = day.pdfUrl
    ? '<a class="btn-pdf" href="'+day.pdfUrl+'" target="_blank" rel="noopener">📄 Baixar material do Dia '+day.num+'</a>'
    : '<div class="pdf-coming">📄 Material em PDF em breve</div>';

  /* 3. Foto de ANTES (somente Dia 1) */
  var beforeHtml = '';
  if (day.hasBefore) {
    beforeHtml =
      '<div class="day-section-label">📸 Foto do Antes</div>' +
      '<p style="font-size:.82rem;color:var(--brown-light);margin-bottom:12px;line-height:1.5">Envie sua foto do <strong>antes</strong> para registrar seu ponto de partida. A Bruna vai acompanhar sua evolução!</p>' +
      buildUploadBlock('antes', 'Enviar foto do antes') +
      '<div id="sent-antes" class="sent-photos"></div>' +
      '<div id="bruna-comment-antes"></div>';
  }

  /* 4. Foto do dia */
  var photoHtml =
    '<div class="day-section-label">📸 Foto do Dia ' + day.num + '</div>' +
    buildUploadBlock('dia'+day.num, 'Enviar foto do dia') +
    '<div id="sent-dia'+day.num+'" class="sent-photos"></div>';

  /* 5. Foto de DEPOIS (somente Dia 10) */
  var afterHtml = '';
  if (day.hasAfter) {
    afterHtml =
      '<div class="day-section-label" style="margin-top:20px">📸 Foto do Depois</div>' +
      '<p style="font-size:.82rem;color:var(--brown-light);margin-bottom:12px;line-height:1.5">Parabéns por chegar até aqui! Envie sua foto do <strong>depois</strong> e veja sua transformação.</p>' +
      buildUploadBlock('depois', 'Enviar foto do depois') +
      '<div id="sent-depois" class="sent-photos"></div>' +
      '<div id="bruna-comment-depois"></div>';
  }

  /* 6. Check-ins */
  var checkinHtml =
    '<div class="checkin-row">' +
      '<button class="btn-checkin" id="ci-agua-'+day.num+'" onclick="doCheckin(\'agua\','+day.num+')">💧 Meta de água atingida</button>' +
      '<button class="btn-checkin" id="ci-dia-'+day.num+'"  onclick="doCheckin(\'checkin\','+day.num+')">✅ Dia concluído</button>' +
    '</div>' +
    '<div id="bruna-comment-dia'+day.num+'"></div>';

  return videoHtml + pdfHtml + beforeHtml + photoHtml + afterHtml + checkinHtml;
}

function buildUploadBlock(tipo, btnLabel) {
  return (
    '<div class="upload-area" onclick="triggerUpload(\''+tipo+'\')">' +
      '<div class="upload-area-icon">📷</div>' +
      '<div class="upload-area-text">Toque para selecionar uma foto</div>' +
    '</div>' +
    '<input type="file" accept="image/*" class="upload-input" id="upload-'+tipo+'" onchange="previewPhoto(this,\''+tipo+'\')">' +
    '<div class="photo-preview" id="preview-'+tipo+'">' +
      '<img id="preview-img-'+tipo+'" src="" alt="Preview">' +
      '<button class="photo-preview-remove" onclick="removePreview(\''+tipo+'\')">✕</button>' +
    '</div>' +
    '<button class="btn-upload" id="btn-send-'+tipo+'" onclick="sendPhoto(\''+tipo+'\')">'+btnLabel+'</button>' +
    '<div class="upload-success" id="success-'+tipo+'">✅ Foto enviada com sucesso!</div>'
  );
}

function toggleDay(num) {
  var h = document.getElementById('dh-'+num), b = document.getElementById('db-'+num);
  var open = h.classList.contains('open');
  h.classList.toggle('open', !open); b.classList.toggle('open', !open);
}

function loadMyData() {
  fetch(WEBHOOK + '?action=get_participant_data&email=' + encodeURIComponent(currentUser.email))
    .then(function(r){ return r.json(); })
    .then(function(data) {
      if (data.fotos) data.fotos.forEach(function(f){ renderSentPhoto(f.tipo, f.url); });
      if (data.comentarios) data.comentarios.forEach(function(c){ renderBrunaComment(c.tipo, c.texto); });
      if (data.checkins) data.checkins.forEach(function(c){ markCheckin(c.tipo, c.dia); });
      updateProgress();
    }).catch(function(){});
}

function markCheckin(tipo, dia) {
  var btn = document.getElementById('ci-'+tipo+'-'+dia);
  if (btn) btn.classList.add('done');
  if (tipo === 'checkin') completedDays[dia] = true;
}

function renderSentPhoto(tipo, url) {
  var c = document.getElementById('sent-'+tipo); if(!c) return;
  if (!c.querySelector('.sent-photos-title')) c.innerHTML='<div class="sent-photos-title">Fotos enviadas</div><div class="sent-photos-grid" id="grid-'+tipo+'"></div>';
  var g = document.getElementById('grid-'+tipo)||c.querySelector('.sent-photos-grid'); if(!g) return;
  var el = document.createElement('div'); el.className='sent-photo-item';
  el.innerHTML='<img src="'+url+'" alt="foto" onerror="this.parentElement.style.display=\'none\'">';
  g.appendChild(el);
}

function renderBrunaComment(tipo, texto) {
  var c = document.getElementById('bruna-comment-'+tipo); if(!c) return;
  var d = document.createElement('div'); d.className='bruna-comment';
  d.innerHTML='<div class="bruna-comment-who">💬 Bruna Boreggio</div><div class="bruna-comment-text">'+texto+'</div>';
  c.appendChild(d);
}

function triggerUpload(tipo) { var i = document.getElementById('upload-'+tipo); if(i) i.click(); }

function previewPhoto(input, tipo) {
  if (!input.files||!input.files[0]) return;
  var r = new FileReader();
  r.onload = function(e) {
    document.getElementById('preview-img-'+tipo).src = e.target.result;
    document.getElementById('preview-'+tipo).style.display = 'block';
    document.getElementById('btn-send-'+tipo).classList.add('visible');
  };
  r.readAsDataURL(input.files[0]);
}

function removePreview(tipo) {
  document.getElementById('upload-'+tipo).value='';
  document.getElementById('preview-'+tipo).style.display='none';
  document.getElementById('btn-send-'+tipo).classList.remove('visible');
}

function sendPhoto(tipo) {
  var input = document.getElementById('upload-'+tipo);
  if (!input||!input.files||!input.files[0]) return;
  var btn = document.getElementById('btn-send-'+tipo); btn.disabled=true; btn.textContent='Enviando…';
  var file = input.files[0], r = new FileReader();
  r.onload = function(e) {
    fetch(WEBHOOK, { method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ action:'photo_upload', email:currentUser.email, nome:currentUser.nome, tipo:tipo, fileData:e.target.result.split(',')[1], fileName:file.name, mimeType:file.type })
    }).then(function(){
      document.getElementById('success-'+tipo).classList.add('show');
      document.getElementById('preview-'+tipo).style.display='none';
      btn.classList.remove('visible');
      showToast('Foto enviada! 🎉');
    }).catch(function(){ btn.disabled=false; btn.textContent='Tentar novamente'; showToast('Erro ao enviar. Tente novamente.'); });
  };
  r.readAsDataURL(file);
}

function doCheckin(tipo, dia) {
  var btn = document.getElementById('ci-'+tipo+'-'+dia);
  if (!btn||btn.classList.contains('done')) return;
  btn.disabled=true;
  fetch(WEBHOOK, { method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ action:'checkin', email:currentUser.email, nome:currentUser.nome, tipo:tipo, dia:dia })
  }).then(function(){
    btn.classList.add('done'); btn.disabled=false;
    if (tipo === 'checkin') { completedDays[dia] = true; updateProgress(); }
    showToast(tipo === 'checkin' ? 'Dia '+dia+' concluído! ✅' : 'Check-in registrado! ✅');
  })
  .catch(function(){ btn.disabled=false; showToast('Erro. Tente novamente.'); });
}

function loadParticipants() {
  fetch(WEBHOOK + '?action=get_participants_list&adminEmail=' + encodeURIComponent(currentUser.email))
    .then(function(r){ return r.json(); })
    .then(function(data) {
      var list = document.getElementById('participantsList'); list.innerHTML='';
      if (!data.participantes||!data.participantes.length) { list.innerHTML='<div class="no-participants">Nenhum participante ainda.</div>'; return; }
      data.participantes.forEach(function(p) {
        var row = document.createElement('div'); row.className='participant-row';
        var es = p.email.replace(/[@.]/g,'-');
        var diasFeitos = p.diasConcluidos || p.pontos || 0;
        row.innerHTML=
          '<div class="participant-header" onclick="toggleParticipant(\'p-'+es+'\')">' +
            '<div><div class="participant-name">'+p.nome+'</div><div class="participant-meta">'+p.email+'</div></div>' +
            '<div class="participant-prog-badge">'+diasFeitos+'/10 dias</div>' +
          '</div>' +
          '<div class="participant-body" id="p-'+es+'">'+buildParticipantBody(p)+'</div>';
        list.appendChild(row);
      });
    }).catch(function(){ document.getElementById('participantsList').innerHTML='<div class="no-participants">Erro ao carregar.</div>'; });
}

function buildParticipantBody(p) {
  var ph = p.fotos&&p.fotos.length
    ? '<div class="participant-photos-grid">'+p.fotos.map(function(f){ return '<div class="participant-photo-item"><img src="'+f.url+'" alt="foto" onerror="this.parentElement.style.display=\'none\'"><div class="participant-photo-tipo">'+f.tipo+'</div></div>'; }).join('')+'</div>'
    : '<p style="font-size:.8rem;color:var(--brown-light);margin-bottom:12px">Nenhuma foto enviada ainda.</p>';
  var es = p.email.replace(/[@.]/g,'-');
  return ph+'<div class="admin-comment-form"><textarea id="comment-'+es+'" placeholder="Deixe um feedback para '+p.nome+'…"></textarea><button class="btn-comment" onclick="sendAdminComment(\''+p.email+'\',\''+es+'\')">Enviar comentário</button></div><div id="comment-result-'+es+'"></div>';
}

function toggleParticipant(id) { var b=document.getElementById(id); if(b) b.classList.toggle('open'); }

function sendAdminComment(emailP, es) {
  var ta = document.getElementById('comment-'+es), texto = ta?ta.value.trim():''; if(!texto) return;
  var btn = ta.nextElementSibling; btn.disabled=true; btn.textContent='Enviando…';
  fetch(WEBHOOL, { method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ action:'admin_comment', adminEmail:currentUser.email, participantEmail:emailP, tipo:'geral', comentario:texto })
  }).then(function(r){ return r.json(); })
  .then(function(data){
    if (data.ok) {
      ta.value=''; btn.disabled=false; btn.textContent='Enviar comentário';
      var re=document.getElementById('comment-result-'+es);
      if(re){ re.innerHTML='<div style="font-size:.78rem;color:var(--green);margin-top:8px">✅ Comentário enviado!</div>'; setTimeout(function(){re.innerHTML='';},3000); }
      showToast('Comentário enviado! 💬');
    }
  }).catch(function(){ btn.disabled=false; btn.textContent='Tentar novamente'; showToast('Erro. Tente novamente.'); });
}

function showToast(msg) {
  var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},3000);
}
</script>

</body>
</html>
